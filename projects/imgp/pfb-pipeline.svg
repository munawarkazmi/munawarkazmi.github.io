<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#81838B"/>
    </marker>
    <marker id="parrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BEC6E7"/>
    </marker>
  </defs>
  <rect width="980" height="360" fill="none"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#E3E5ED">Evaluation pipeline: one verdict per response, no judge anywhere</text>

  <rect x="20" y="80" width="168" height="118" rx="14" fill="#222329" stroke="#BEC6E7" stroke-width="2"/>
  <text x="104" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#E3E5ED">Labelled instruction</text>
  <text x="104" y="132" text-anchor="middle" font-size="12" fill="#92949C">+ symbolic world</text>
  <text x="104" y="156" text-anchor="middle" font-size="12" fill="#92949C">one planted trap,</text>
  <text x="104" y="172" text-anchor="middle" font-size="12" fill="#92949C">or none</text>

  <line x1="192" y1="139" x2="212" y2="139" stroke="#81838B" stroke-width="2" marker-end="url(#parr)"/>

  <rect x="216" y="80" width="168" height="118" rx="14" fill="#191A1D" stroke="#33343A" stroke-width="2"/>
  <text x="300" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#E3E5ED">Fixed prompt</text>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#92949C">plain, or obfuscated</text>
  <text x="300" y="152" text-anchor="middle" font-size="12" fill="#92949C">by a versioned</text>
  <text x="300" y="168" text-anchor="middle" font-size="12" fill="#92949C">bijective renaming</text>

  <line x1="388" y1="139" x2="408" y2="139" stroke="#81838B" stroke-width="2" marker-end="url(#parr)"/>

  <rect x="412" y="80" width="168" height="118" rx="14" fill="#191A1D" stroke="#33343A" stroke-width="2"/>
  <text x="496" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#E3E5ED">Model under test</text>
  <text x="496" y="136" text-anchor="middle" font-size="12" fill="#92949C">answers in JSON:</text>
  <text x="496" y="152" text-anchor="middle" font-size="12" fill="#92949C">a plan, infeasible,</text>
  <text x="496" y="168" text-anchor="middle" font-size="12" fill="#92949C">or clarify</text>

  <line x1="584" y1="139" x2="604" y2="139" stroke="#81838B" stroke-width="2" marker-end="url(#parr)"/>

  <rect x="608" y="80" width="168" height="118" rx="14" fill="#191A1D" stroke="#33343A" stroke-width="2"/>
  <text x="692" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#E3E5ED">Deterministic checker</text>
  <text x="692" y="136" text-anchor="middle" font-size="12" fill="#92949C">inverse renaming,</text>
  <text x="692" y="152" text-anchor="middle" font-size="12" fill="#92949C">then simulates</text>
  <text x="692" y="168" text-anchor="middle" font-size="12" fill="#92949C">every step</text>

  <line x1="780" y1="139" x2="800" y2="139" stroke="#81838B" stroke-width="2" marker-end="url(#parr)"/>

  <rect x="804" y="80" width="156" height="118" rx="14" fill="#222329" stroke="#BEC6E7" stroke-width="2"/>
  <text x="882" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#E3E5ED">Verdict + matrix</text>
  <text x="882" y="136" text-anchor="middle" font-size="12" fill="#92949C">planted vs observed,</text>
  <text x="882" y="152" text-anchor="middle" font-size="12" fill="#92949C">detection with paired</text>
  <text x="882" y="168" text-anchor="middle" font-size="12" fill="#92949C">false positives</text>

  <rect x="60" y="262" width="330" height="66" rx="12" fill="#191A1D" stroke="#BEC6E7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="225" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E3E5ED">Per-seed label proofs</text>
  <text x="225" y="308" text-anchor="middle" font-size="12" fill="#92949C">re-proved in CI on every commit (589 tests)</text>
  <line x1="150" y1="262" x2="104" y2="202" stroke="#BEC6E7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#parrg)"/>

  <rect x="540" y="262" width="360" height="66" rx="12" fill="#191A1D" stroke="#BEC6E7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="720" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E3E5ED">Independent PDDL toolchain</text>
  <text x="720" y="308" text-anchor="middle" font-size="12" fill="#92949C">differential testing: first failing step must agree</text>
  <line x1="700" y1="262" x2="692" y2="202" stroke="#BEC6E7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#parrg)"/>
</svg>
