<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B877D"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0796B"/>
    </marker>
  </defs>
  <rect width="980" height="380" fill="#121214"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#EDEAE3">Where the verifier sits: between the language model and the robot</text>

  <!-- LLM box -->
  <rect x="40" y="120" width="200" height="110" rx="14" fill="#241F17" stroke="#C9A876" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#EDEAE3">LLM planner</text>
  <text x="140" y="178" text-anchor="middle" font-size="12.5" fill="#9C988F">Llama-3.1-8B, quantized</text>
  <text x="140" y="196" text-anchor="middle" font-size="12.5" fill="#9C988F">goals and trajectories</text>
  <text x="140" y="214" text-anchor="middle" font-size="12.5" fill="#E0796B">may hallucinate</text>

  <!-- Verifier box -->
  <rect x="340" y="95" width="280" height="160" rx="14" fill="#24262C"/>
  <text x="480" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#E8D5B0">Safety verifier</text>
  <text x="480" y="150" text-anchor="middle" font-size="12.5" fill="#C3BFB6">deterministic, latency target 50 ms</text>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#C3BFB6">costmap collision check</text>
  <text x="480" y="196" text-anchor="middle" font-size="12.5" fill="#C3BFB6">kinematic feasibility</text>
  <text x="480" y="216" text-anchor="middle" font-size="12.5" fill="#C3BFB6">workspace bounds</text>
  <text x="480" y="240" text-anchor="middle" font-size="12" fill="#979289">Jetson Orin Nano</text>

  <!-- Nav2 box -->
  <rect x="720" y="120" width="220" height="110" rx="14" fill="#1B1C20" stroke="#33343A" stroke-width="2"/>
  <text x="830" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#EDEAE3">Nav2 controller</text>
  <text x="830" y="182" text-anchor="middle" font-size="12.5" fill="#9C988F">executes on TurtleBot3</text>
  <text x="830" y="202" text-anchor="middle" font-size="12.5" fill="#9C988F">only verified commands</text>

  <!-- arrows -->
  <line x1="240" y1="175" x2="332" y2="175" stroke="#8B877D" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="286" y="163" text-anchor="middle" font-size="12" fill="#9C988F">proposed plan</text>
  <line x1="620" y1="175" x2="712" y2="175" stroke="#8B877D" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="666" y="163" text-anchor="middle" font-size="12" fill="#7FB894" font-weight="700">safe: pass</text>

  <!-- reject path -->
  <path d="M 480 255 L 480 310 L 148 310 L 148 238" fill="none" stroke="#E0796B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
  <text x="314" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E0796B">unsafe: rejected, replan requested</text>

  <!-- status strip -->
  <text x="490" y="360" text-anchor="middle" font-size="13" fill="#9C988F">design concept - implementation and evaluation in progress</text>
</svg>
